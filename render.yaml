databases:
  - name: productos-db
    databaseName: productos
    user: productos_user
    plan: free

services:
  - type: web
    name: practicasapi-productos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: productos-db
          property: connectionString
      - key: DB_SCHEMA
        value: tienda
      - key: DB_SSL
        value: 'true'
      - key: CORS_ORIGIN
        value: https://kiddomaki.github.io
