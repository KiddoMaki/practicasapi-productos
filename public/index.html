<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Gestión de Productos</h1>
    <p>API: <code>/api/productos</code></p>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="form-title">Crear producto</h2>
      <form id="producto-form">
        <input type="hidden" id="producto-id" />
        <div class="grid">
          <label>
            Nombre
            <input type="text" id="nombre" name="nombre" maxlength="200" required />
          </label>
          <label>
            Categoría
            <input type="text" id="categoria" name="categoria" maxlength="100" required />
          </label>
          <label>
            Precio de venta al público
            <input type="number" id="precio_venta_publico" name="precio_venta_publico" min="0" step="0.01" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="submit-btn" class="btn primary">Crear</button>
          <button type="button" id="cancel-edit" class="btn secondary hidden">Cancelar edición</button>
        </div>
      </form>
      <div id="form-message" class="message" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Productos</h2>
        <div class="pagination-info" id="pagination-info"></div>
      </div>
      <div class="actions">
        <button type="button" id="prev-btn" class="btn secondary">Anterior</button>
        <button type="button" id="next-btn" class="btn secondary">Siguiente</button>
        <button type="button" id="refresh-btn" class="btn primary">Actualizar lista</button>
      </div>
      <div id="list-message" class="message" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio venta público</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productos-body">
            <tr><td colspan="5">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
